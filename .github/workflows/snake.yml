name: Generate Contribution Snake

on:
  push:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: gusmadd
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00e5ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
